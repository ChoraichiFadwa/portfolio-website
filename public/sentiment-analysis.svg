<?xml version="1.0" encoding="UTF-8"?>
<!-- Sentiment-analysis thumbnail (600 × 300) -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="600" height="300" viewBox="0 0 600 300" role="img"
     aria-label="Laptop showing sentiment analysis – bar chart and word cloud">
  <!-- Background -------------------------------------------------------->
  <rect width="600" height="300" fill="#0F1B2E"/>

  <!-- ✨ Floating particles --------------------------------------------->
  <g fill="#24334c">
    <circle cx="50"  cy="60"  r="3"/>
    <circle cx="545" cy="105" r="2"/>
    <circle cx="310" cy="18"  r="4"/>
    <circle cx="310" cy="22"  r="1.5"/>
    <circle cx="120" cy="240" r="2.5"/>
    <circle cx="470" cy="260" r="2"/>
  </g>

  <!-- Python logo (simplified) ----------------------------------------->
  <g transform="translate(60,70)">
    <path d="M40 0 h30 a6 6 0 0 1 6 6 v16 a6 6 0 0 1 -6 6 h-10 v8 h18
             a6 6 0 0 0 6 -6 v-34 a6 6 0 0 0 -6 -6 h-32 a6 6 0 0 0 -6 6 v12 h10 z"
          fill="#306998"/>
    <circle cx="56" cy="11" r="3.5" fill="#0F1B2E"/>
    <path d="M40 52 h-30 a6 6 0 0 1 -6 -6 v-16 a6 6 0 0 1 6 -6 h10 v-8 h-18
             a6 6 0 0 0 -6 6 v34 a6 6 0 0 0 6 6 h32 a6 6 0 0 0 6 -6 v-12 h-10 z"
          fill="#FFD343"/>
    <circle cx="24" cy="41" r="3.5" fill="#0F1B2E"/>
  </g>

  <!-- Gear icon --------------------------------------------------------->
  <g transform="translate(470 68)" fill="#4B6989">
    <circle r="19"/>
    <circle r="10" fill="#0F1B2E"/>
    <g transform="rotate(22)">
      <rect x="-3" y="-29" width="6" height="10" rx="2"/>
      <rect x="-3" y="19"  width="6" height="10" rx="2"/>
      <rect x="-29" y="-3" width="10" height="6" rx="2"/>
      <rect x="19"  y="-3" width="10" height="6" rx="2"/>
    </g>
  </g>

  <!-- Star-rating speech bubble ----------------------------------------->
  <g transform="translate(465 85)">
    <rect width="110" height="48" rx="8" fill="#FFFFFF"/>
    <polygon points="18,48 0,58 0,42" fill="#FFFFFF"/>
    <text x="55" y="29" font-size="20" text-anchor="middle"
          font-family="Segoe UI, sans-serif" fill="#FFCC33">★★★★★</text>
  </g>

  <!-- Laptop base ------------------------------------------------------->
  <g>
    <rect x="180" y="45" width="280" height="170" rx="12"
          fill="#1E2A3C" stroke="#3F4C60" stroke-width="4"/>
    <rect x="180" y="215" width="280" height="45" rx="6" fill="#1E2A3C"/>
    <rect x="230" y="230" width="180" height="12" rx="3" fill="#3F4C60"/>
  </g>

  <!-- Bar chart --------------------------------------------------------->
  <g font-family="Segoe UI, sans-serif" font-size="14">
    <rect x="225" y="95" width="35" height="80" fill="#3CB371"/>
    <rect x="275" y="115" width="35" height="60" fill="#636B75"/>
    <rect x="325" y="135" width="35" height="40" fill="#E3625D"/>

    <text x="242" y="190" text-anchor="middle" fill="#D9D9D9">Positive</text>
    <text x="292" y="190" text-anchor="middle" fill="#D9D9D9">Neutral</text>
    <text x="342" y="190" text-anchor="middle" fill="#D9D9D9">Negative</text>
  </g>

  <!-- Word cloud -------------------------------------------------------->
  <g font-family="Segoe UI, sans-serif" font-weight="600">
    <text x="385" y="98"  font-size="26" fill="#3CB371">easy</text>
    <text x="345" y="128" font-size="24" fill="#4AA5D4">buggy</text>
    <text x="385" y="158" font-size="24" fill="#F7B550">fast</text>
    <text x="430" y="158" font-size="24" fill="#F7B550">=</text>
    <text x="350" y="188" font-size="26" fill="#E3625D">crash</text>
    <text x="400" y="214" font-size="20" fill="#3CB371">simple</text>
  </g>
</svg>
